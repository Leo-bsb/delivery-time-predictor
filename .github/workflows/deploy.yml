name: Deploy to HuggingFace Space

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install
          git lfs pull

      - name: Configure Git for HF
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "github-actions"

      - name: Clone HF Space Repo
        run: |
          git clone https://huggingface.co/spaces/leo-bsb/Delivery-Time-Predictor hf_space
          ls -la hf_space

      - name: Copy project files into HF space
        run: |
          cp -r api frontend app.py dockerfile requirements.txt .gitattributes README.md delivery_model.pkl hf_space/
          # Ajuste aqui dependendo dos arquivos do seu projeto real

      - name: Commit & Push to HF
        run: |
          cd hf_space
          git add .
          git commit -m "Sync project from GitHub Actions" || echo "No changes to commit"
          git push https://leo-bsb:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/leo-bsb/Delivery-Time-Predictor main
