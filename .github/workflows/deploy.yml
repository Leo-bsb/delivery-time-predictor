name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Ativa no push para a branch main

jobs:
  deploy-to-hf-space:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout do Repositório (com LFS)
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4
        with:
          lfs: true      # <-- Essencial para baixar o .pkl
          fetch-depth: 0 # Necessário para o checkout completo

      # 2. Set up Python (para o Ruff)
      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # 3. Install Ruff
      - name: 3. Install Ruff
        run: pip install ruff

      # 4. Run Ruff Linter
      - name: 4. Run Ruff Linter
        run: ruff check . --output-format=github
        
      # 5. Push para o Hugging Face Space (O NOVO MÉTODO OFICIAL)
      # Esta action cuida de tudo: LFS, tokens, e o push.
      - name: 5. Push para o Hugging Face Space
        uses: huggingface/push-to-hub@v0.1
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_id: leo-bsb/Delivery-Time-Predictor
          repo_type: space
          force: true # Força o push para sincronizar com a branch main