name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main ] # Ativa no push para a branch main

jobs:
  deploy-to-hf-space:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout (com LFS)
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4
        with:
          lfs: true      # <-- Essencial para baixar o .pkl
          fetch-depth: 0 

      # 2. Set up Python (para o Ruff)
      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # 3. Install Ruff
      - name: 3. Install Ruff
        run: pip install ruff

      # 4. Run Ruff Linter
      - name: 4. Run Ruff Linter
        run: ruff check . --output-format=github
        
      # 5. Push para o Hugging Face (O MÉTODO CORRETO)
      # Esta é a action oficial e com o nome correto.
      - name: 5. Push para o Hugging Face Space
        uses: huggingface/hub-action@v1 # <-- NOME CORRETO
        with:
          token: ${{ secrets.HF_TOKEN }}
          repository: leo-bsb/Delivery-Time-Predictor
          repo_type: space
          commit_message: "Deploy to Space from GitHub Actions"