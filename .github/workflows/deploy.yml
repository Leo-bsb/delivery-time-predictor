name: Deploy to HuggingFace Space

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Isso já baixa os arquivos do LFS automaticamente

      - name: Push to Hugging Face
        run: |
          # Adiciona o repositório do Hugging Face como um "remote"
          # Estamos usando 'HEAD:main' para forçar o push do commit atual para a branch 'main' do HF
          git push https://leo-bsb:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/leo-bsb/Delivery-Time-Predictor HEAD:main --force