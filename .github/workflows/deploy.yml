name: Deploy to HuggingFace Space

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # <-- Adicione esta linha

      - name: Install Xet
              run: |
                curl -L https://github.com/xetdata/xet-tools/releases/latest/download/git-xet-linux-x86_64 -o git-xet
                chmod +x git-xet
                sudo mv git-xet /usr/local/bin/
                git xet login --token ${{ secrets.HF_TOKEN }} # Tenta logar automaticamente

      - name: Push to Hugging Face
        run: |
          # Adiciona o repositório do Hugging Face como um "remote"
          # Estamos usando 'HEAD:main' para forçar o push do commit atual para a branch 'main' do HF
          git push https://leo-bsb:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/leo-bsb/Delivery-Time-Predictor HEAD:main --force